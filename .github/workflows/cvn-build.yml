name: CVN build

# Builds the CVN edition for Windows and Linux. Pushing a tag that starts with
# "cvn-" also publishes the result as a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'cvn-*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt dependencies (published by the XMRig project)
        run: git clone --depth 1 https://github.com/xmrig/xmrig-deps.git ../xmrig-deps

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DXMRIG_DEPS="$((Resolve-Path ..\..\xmrig-deps\msvc2022\x64).Path)"
          cmake --build . --config Release --parallel

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path package/xmrig-cvn | Out-Null
          Copy-Item build/Release/xmrig.exe, bin/WinRing0/WinRing0x64.sys, LICENSE, README.md, scripts/start_cvn.cmd -Destination package/xmrig-cvn
          Compress-Archive -Path package/xmrig-cvn -DestinationPath xmrig-cvn-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xmrig-cvn-windows-x64
          path: xmrig-cvn-windows-x64.zip

  linux:
    name: Linux x64 (static)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake automake libtool autoconf wget

      - name: Build dependencies
        run: cd scripts && ./build_deps.sh

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DXMRIG_DEPS=scripts/deps -DBUILD_STATIC=ON
          make -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p package/xmrig-cvn
          cp build/xmrig LICENSE README.md scripts/start_cvn.sh package/xmrig-cvn/
          tar -C package -czf xmrig-cvn-linux-static-x64.tar.gz xmrig-cvn

      - uses: actions/upload-artifact@v4
        with:
          name: xmrig-cvn-linux-static-x64
          path: xmrig-cvn-linux-static-x64.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/cvn-')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum xmrig-cvn-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            xmrig-cvn-windows-x64.zip
            xmrig-cvn-linux-static-x64.tar.gz
            SHA256SUMS
